<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ชำระเบี้ยต่ออายุกรมธรรม์รถยนต์ภาคสมัครใจ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap');

  :root{
    --navy:#0a2a5e;
    --orange:#f5a623;
    --orange-dark:#e8930f;
    --gray-border:#dfe2e8;
    --placeholder:#9aa1ac;
    --red:#e0392b;
    --text:#3a3a3a;
    --link:#2f6fd6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Prompt', sans-serif;
    background:#eceff3;
    display:flex;
    justify-content:center;
    padding:40px 12px;
  }

  .card{
    width:100%;
    max-width:720px;
    background:#fff;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(20,30,60,0.12);
    padding:34px 40px 42px;
  }

  h1{
    text-align:center;
    color:var(--navy);
    font-size:24px;
    font-weight:700;
    margin-bottom:28px;
  }

  .radio-row{
    display:flex;
    gap:44px;
    margin-bottom:28px;
  }
  .radio-item{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:15px;
    color:var(--text);
    cursor:pointer;
  }
  .radio-circle{
    width:20px;
    height:20px;
    border-radius:50%;
    border:2px solid var(--gray-border);
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
  }
  .radio-item.checked .radio-circle{
    border-color:var(--orange);
  }
  .radio-item.checked .radio-circle::after{
    content:"";
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--orange);
  }

  .field-row{
    display:flex;
    gap:24px;
    margin-bottom:22px;
  }
  .field{
    flex:1;
  }
  .field label{
    display:block;
    font-size:14px;
    color:var(--text);
    margin-bottom:9px;
  }
  .field label .req{
    color:var(--red);
    margin-right:3px;
    font-weight:700;
  }
  .field input, .field select{
    width:100%;
    padding:12px 15px;
    border:1.5px solid var(--gray-border);
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    color:#333;
    outline:none;
    background:#fff;
  }
  .field input::placeholder{color:var(--placeholder);}
  .field input:focus, .field select:focus{border-color:var(--navy);}

  .select-wrap{position:relative;}
  .select-wrap select{
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
    cursor:pointer;
    color:var(--placeholder);
  }
  .select-wrap::after{
    content:"";
    position:absolute;
    right:16px; top:50%;
    width:8px; height:8px;
    border-right:1.6px solid #555;
    border-bottom:1.6px solid #555;
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
  }

  /* Added field (not part of original site) */
  .field.added{
    background:#fff8e1;
    border:2px dashed var(--orange);
    border-radius:10px;
    padding:12px 14px 14px;
  }
  .field.added label{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
  }
  .added-badge{
    background:var(--orange);
    color:#fff;
    font-size:10px;
    font-weight:600;
    padding:2px 7px;
    border-radius:4px;
    white-space:nowrap;
  }

  h2{
    font-size:15px;
    font-weight:600;
    color:var(--navy);
    margin:6px 0 16px;
  }

  .consent-block{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  .consent-block input[type="checkbox"]{
    width:18px; height:18px; min-width:18px;
    margin-top:2px;
    border:1.5px solid var(--gray-border);
    border-radius:3px;
    accent-color:var(--navy);
    cursor:pointer;
  }
  .consent-block p{
    font-size:12.5px;
    line-height:1.7;
    color:var(--text);
  }
  .consent-block p a{
    color:var(--link);
    text-decoration:underline;
  }
  .consent-block p .req{
    color:var(--red);
    margin-right:3px;
    font-weight:700;
  }
  .consent-error{
    color:var(--red);
    font-size:12.5px;
    margin-bottom:16px;
  }

  .submit-wrap{
    display:flex;
    justify-content:center;
    margin-top:12px;
  }

  #consent-section{ display:none; }

  .verify-loading, .verify-success{
    display:none;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:20px 0;
    font-size:14.5px;
    color:var(--text);
  }
  .spinner{
    width:24px; height:24px;
    border:3px solid var(--gray-border);
    border-top-color:var(--orange);
    border-radius:50%;
    animation:vmi-spin 0.8s linear infinite;
  }
  @keyframes vmi-spin{ to{ transform:rotate(360deg); } }
  .verify-success .check-circle{
    width:24px; height:24px;
    border-radius:50%;
    background:#2e9e5b;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:700;
  }
  .submit-btn{
    background:var(--orange);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:13px 70px;
    font-family:inherit;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
  }
  .submit-btn:hover{background:var(--orange-dark);}

  .or-text{
    text-align:center;
    color:#8a919c;
    font-size:14px;
    margin:16px 0 6px;
    position:relative;
  }

  .link-wrap{
    display:flex;
    justify-content:center;
    position:relative;
  }
  .link-wrap a{
    color:var(--link);
    text-decoration:underline;
    font-size:14.5px;
  }

  .hand-pointer{
    position:absolute;
    right:calc(50% - 70px);
    top:-46px;
    width:34px;
    height:34px;
    color:var(--orange);
    transform:rotate(-10deg);
    z-index:3;
  }
  .hand-pointer svg{width:100%; height:100%;}

  @media(max-width:600px){
    .field-row{flex-direction:column; gap:20px;}
    .radio-row{gap:24px;}
  }
</style>
</head>
<body>

<div style="position:fixed; top:0; left:0; right:0; z-index:99999; display:flex; align-items:center; justify-content:center; gap:14px; background:#0a2a5e; padding:6px 20px; font-family:'Prompt',sans-serif; font-size:12px; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
  <a href="../index.html" style="color:#fff; text-decoration:none;">&#8962; กลับหน้าหลัก</a>
  <span style="color:rgba(255,255,255,0.4);">|</span>
  <a href="viriyah-com.html" style="color:#fff; text-decoration:none;">เมนู Viriyah.com</a>
</div>

<div class="card" style="margin-top:32px;">
  <h1>ชำระเบี้ยต่ออายุกรมธรรม์รถยนต์ภาคสมัครใจ</h1>

  <div class="radio-row">
    <div class="radio-item checked">
      <div class="radio-circle"></div>
      <span>ทะเบียนรถผู้เอาประกัน</span>
    </div>
    <div class="radio-item">
      <div class="radio-circle"></div>
      <span>เลขกรมธรรม์</span>
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label><span class="req">*</span>ป้ายทะเบียน</label>
      <input type="text" placeholder="1กง 1234">
    </div>
    <div class="field">
      <label><span class="req">*</span>ทะเบียนจังหวัด</label>
      <div class="select-wrap">
        <select><option>ทะเบียนจังหวัด</option></select>
      </div>
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label><span class="req">*</span>เลขที่ประชาชนผู้เอาประกัน / เลขผู้เสียภาษีผู้เอาประกัน</label>
      <input type="text" placeholder="เลขที่ประชาชนผู้เอาประกัน / เลขผู้เสียภาษีผู้เอาปร">
    </div>
  </div>

  <div class="field-row">
    <div class="field added">
      <label><span class="req">*</span>ชื่อ<span class="added-badge">เพิ่มใหม่</span></label>
      <input type="text" id="firstname" placeholder="ชื่อ">
    </div>
    <div class="field added">
      <label><span class="req">*</span>นามสกุล<span class="added-badge">เพิ่มใหม่</span></label>
      <input type="text" id="lastname" placeholder="นามสกุล">
    </div>
  </div>

  <div class="field-row">
    <div class="field added">
      <label><span class="req">*</span>เบอร์โทรศัพท์<span class="added-badge">เพิ่มใหม่</span></label>
      <input type="tel" id="mobile" placeholder="เบอร์โทรศัพท์">
    </div>
  </div>

  <div class="submit-wrap" id="verify-wrap">
    <button class="submit-btn" id="verify-btn">ยืนยัน</button>
  </div>

  <div class="verify-loading" id="verify-loading">
    <div class="spinner"></div>
    <span>กำลังตรวจสอบข้อมูล...</span>
  </div>

  <div class="verify-success" id="verify-success">
    <div class="check-circle">&#10003;</div>
    <span>ยืนยันตัวตนสำเร็จ</span>
  </div>

  <div id="consent-section">
    <h2>นโยบายและเงื่อนไข</h2>

    <div id="consent-list">
      <div class="consent-block">
        <p>กำลังโหลดข้อมูลความยินยอม...</p>
      </div>
    </div>

    <div class="submit-wrap">
      <button class="submit-btn" id="submit-btn">ส่งข้อมูล</button>
    </div>
  </div>

  <div class="or-text">หรือ</div>

  <div class="link-wrap">
    <a href="#">ชำระเบี้ยต่ออายุประกันภัยด้วยวิธีอื่น ๆ</a>
  </div>
</div>

<script>
  const CONSENT_KEY = "GVHfR2xE2SitX%2fjlcOZbtQ%3d%3d";
  const CONSENT_API_URL = `http://172.21.20.248/api/AdminPreferenceConsentForm/PreferenceFormToken?Key=${CONSENT_KEY}`;
  const SAVE_CONSENT_API_URL = "https://172.21.20.248/api/AdminPreferenceConsentForm/PreferenceFormConsent";

  const FALLBACK_PURPOSES = [
    { purpose_id: "1", purpose_th: "เพื่อการให้บริการและติดต่อสื่อสารตามที่ท่านร้องขอ", is_required: true, selected: true },
    { purpose_id: "2", purpose_th: "เพื่อการนำเสนอผลิตภัณฑ์และบริการที่เกี่ยวข้อง", is_required: false, selected: false },
    { purpose_id: "3", purpose_th: "เพื่อการวิเคราะห์และพัฒนาปรับปรุงคุณภาพบริการ", is_required: false, selected: false },
    { purpose_id: "4", purpose_th: "เพื่อการทำการตลาดและประชาสัมพันธ์ผ่านช่องทางต่างๆ", is_required: false, selected: false }
  ];

  async function loadConsentOptions(){
    const list = document.getElementById('consent-list');
    let purposes;
    try{
      const response = await fetch(CONSENT_API_URL, {
        method: "GET"
      });
      if(!response.ok) throw new Error("HTTP " + response.status);

      const data = await response.json();
      purposes = data.purpose_option || [];
    }catch(error){
      console.warn("โหลดข้อมูลความยินยอมจาก backend ไม่สำเร็จ ใช้ข้อมูลตัวอย่างแทน (demo mode):", error);
      purposes = FALLBACK_PURPOSES;
    }

    list.innerHTML = purposes.map(p => `
      <div class="consent-block">
        <input type="checkbox" class="consent-checkbox" data-purpose-id="${p.purpose_id}" data-required="${p.is_required}" ${p.selected ? "checked" : ""}>
        <p>${p.is_required ? '<span class="req">*</span>' : ""}${p.purpose_th}</p>
      </div>
    `).join("");
  }

  // NOTE: secret ฝัง client-side แบบนี้ใครก็เปิดดู source แล้วรู้ค่าได้ ทำให้ปลอม JWT ที่เซ็นถูกต้องเองได้
  // เหมาะสำหรับ prototype เท่านั้น งาน production ควรย้ายการเซ็น JWT ไปทำฝั่ง server
  const JWT_SECRET = "zxcvzaqxsw12345";

  function base64UrlEncodeBytes(bytes){
    let binary = "";
    bytes.forEach(b => binary += String.fromCharCode(b));
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function base64UrlEncodeString(str){
    return base64UrlEncodeBytes(new TextEncoder().encode(str));
  }

  async function signJWT(payload, secret){
    const header = { alg: "HS256", typ: "JWT" };
    const signingInput = `${base64UrlEncodeString(JSON.stringify(header))}.${base64UrlEncodeString(JSON.stringify(payload))}`;

    const key = await crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(secret),
      { name: "HMAC", hash: "SHA-256" },
      false,
      ["sign"]
    );
    const signatureBuffer = await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(signingInput));
    return `${signingInput}.${base64UrlEncodeBytes(new Uint8Array(signatureBuffer))}`;
  }

  async function sha256Hex(str){
    const hashBuffer = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  async function buildLeadJWT(){
    const firstname = document.getElementById('firstname').value.trim();
    const lastname = document.getElementById('lastname').value.trim();
    const mobile = document.getElementById('mobile').value.trim();

    const uid = await sha256Hex(`${firstname}-${lastname}-${mobile}`);

    const payload = {
      UID: uid,
      Firstname: firstname,
      Lastname: lastname,
      Email: "",
      Mobile: mobile,
      DataSubjectType: "Customer"
    };

    return signJWT(payload, JWT_SECRET);
  }

  // DEMO เท่านั้น: การ "ตรวจสอบ" นี้เป็นแค่หน้ากาก ไม่มีการยืนยันตัวตนจริงกับระบบใดๆ
  // จะขึ้นว่าผ่านเสมอ ใช้เพื่อจำลองขั้นตอนก่อนแสดงส่วนนโยบายและเงื่อนไขเท่านั้น
  document.getElementById('verify-btn').addEventListener('click', () => {
    document.getElementById('verify-wrap').style.display = 'none';
    document.getElementById('verify-loading').style.display = 'flex';

    setTimeout(() => {
      document.getElementById('verify-loading').style.display = 'none';
      document.getElementById('verify-success').style.display = 'flex';

      setTimeout(() => {
        const consentSection = document.getElementById('consent-section');
        consentSection.style.display = 'block';
        loadConsentOptions();
        consentSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 800);
    }, 1400);
  });

  document.getElementById('submit-btn').addEventListener('click', async () => {
    const token = await buildLeadJWT();

    const selectedPurposes = Array.from(document.querySelectorAll('.consent-checkbox'))
      .filter(cb => cb.checked)
      .map(cb => ({ PurposeOption: cb.dataset.purposeId }));

    try{
      const saveResponse = await fetch(SAVE_CONSENT_API_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          purpose_option: selectedPurposes,
          key: CONSENT_KEY,
          token_key: token
        })
      });
      if(!saveResponse.ok) throw new Error("HTTP " + saveResponse.status);

      const result = await saveResponse.text();
      console.log("บันทึกข้อมูลสำเร็จ:", result);
      alert("ส่งข้อมูลเรียบร้อยแล้ว");
    }catch(error){
      console.warn("บันทึกข้อมูลไป backend ไม่สำเร็จ (demo mode - ไม่มีการเชื่อมต่อ backend จริงจากเว็บ public):", error);
      alert("ส่งข้อมูลเรียบร้อยแล้ว");
    }
  });
</script>

</body>
</html>
